name: Build Web App & Android Debug APK

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Validate, Build Web & Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: 'package-lock.json'

      - name: Setup Java 21 (Required by Capacitor 8 & Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v3

      - name: Install Node dependencies (Reproducible via package-lock.json)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Run automated repair & curriculum validation suites
        run: |
          npm run test
          npm run validate:curriculum

      - name: Build production web bundle
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '' }}
          VITE_SHEETS_WEBHOOK_URL: ${{ secrets.VITE_SHEETS_WEBHOOK_URL || '' }}
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission to Gradle wrapper
        working-directory: ./android
        run: chmod +x ./gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK exists
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngliMensh-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
