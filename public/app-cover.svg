<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Space Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#030712" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <radialGradient id="cyan-glow" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="gold-glow" cx="70%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="book-light" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.65" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="gold-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Metallic Silver/Blue Gradient for Text -->
    <linearGradient id="silver-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="70%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Blue Owl Character Gradients -->
    <linearGradient id="owl-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="owl-belly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="owl-beak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Cyber Monogram E Cyan -->
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="1200" height="675" fill="url(#bg-glow)" />
  <rect width="1200" height="675" fill="url(#cyan-glow)" />
  <rect width="1200" height="675" fill="url(#gold-glow)" />

  <!-- Digital Grid Mesh on sides -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="100" x2="350" y2="400" />
    <line x1="100" y1="50" x2="400" y2="350" />
    <line x1="850" y1="400" x2="1150" y2="100" />
    <line x1="800" y1="350" x2="1100" y2="50" />
    <circle cx="200" cy="250" r="120" fill="none" stroke-dasharray="4,6" />
    <circle cx="1000" cy="250" r="120" fill="none" stroke-dasharray="4,6" />
  </g>

  <!-- Sparkles & Stars -->
  <g fill="#ffffff">
    <circle cx="180" cy="120" r="2.5" opacity="0.8" />
    <circle cx="280" cy="190" r="1.5" opacity="0.6" />
    <circle cx="340" cy="90" r="3" opacity="0.9" />
    <circle cx="860" cy="140" r="2" opacity="0.8" />
    <circle cx="950" cy="90" r="3.5" opacity="0.95" />
    <circle cx="1040" cy="180" r="1.5" opacity="0.6" />
    <circle cx="1120" cy="280" r="2" opacity="0.7" />
    <circle cx="120" cy="380" r="1.5" opacity="0.5" />
    <circle cx="580" cy="80" r="2" opacity="0.8" />
    <circle cx="640" cy="110" r="1.5" opacity="0.7" />
  </g>

  <!-- Sound Waves (Center Horizon) -->
  <g opacity="0.65" stroke="url(#gold-metal)" stroke-width="3" stroke-linecap="round">
    <line x1="280" y1="290" x2="280" y2="300" />
    <line x1="300" y1="280" x2="300" y2="310" />
    <line x1="320" y1="270" x2="320" y2="320" />
    <line x1="340" y1="260" x2="340" y2="330" />
    <line x1="360" y1="275" x2="360" y2="315" />
    <line x1="380" y1="285" x2="380" y2="305" />

    <line x1="820" y1="285" x2="820" y2="305" />
    <line x1="840" y1="275" x2="840" y2="315" />
    <line x1="860" y1="260" x2="860" y2="330" />
    <line x1="880" y1="270" x2="880" y2="320" />
    <line x1="900" y1="280" x2="900" y2="310" />
    <line x1="920" y1="290" x2="920" y2="300" />
  </g>

  <!-- LEFT: 3D CYBERNETIC 'E' MONOGRAM -->
  <g transform="translate(360, 160)" filter="url(#glow-filter)">
    <path d="M0,20 L110,20 L110,50 L40,50 L40,85 L95,85 L95,115 L40,115 L40,150 L115,150 L115,180 L0,180 Z"
          fill="none" stroke="url(#cyber-cyan)" stroke-width="12" stroke-linejoin="round" />
    <path d="M10,30 L100,30 L100,42 L30,42 L30,95 L85,95 L85,107 L30,107 L30,160 L105,160 L105,172 L10,172 Z"
          fill="url(#cyber-cyan)" opacity="0.3" />
    <circle cx="110" cy="20" r="5" fill="#38bdf8" />
    <circle cx="95" cy="85" r="5" fill="#38bdf8" />
    <circle cx="115" cy="180" r="5" fill="#38bdf8" />
  </g>

  <!-- RIGHT: 3D GOLDEN WINGED 'M' MONOGRAM -->
  <g transform="translate(680, 150)" filter="url(#glow-filter)">
    <!-- Golden Winged 'M' -->
    <path d="M30,190 L30,40 L90,130 L150,40 L150,190 L120,190 L120,95 L90,140 L60,95 L60,190 Z"
          fill="url(#gold-metal)" stroke="#d97706" stroke-width="4" stroke-linejoin="round" />
    <!-- Wing flourish on the right side -->
    <path d="M150,40 Q190,10 210,-10 Q200,45 180,75 Q210,55 220,40 Q200,90 170,120 Q195,110 200,100 Q180,145 150,165 Z"
          fill="url(#gold-metal)" opacity="0.95" />
    <!-- Speech bubble icon above 'M' with voice bars -->
    <g transform="translate(90, 10)">
      <circle cx="35" cy="35" r="32" fill="url(#gold-metal)" stroke="#fef08a" stroke-width="2.5" />
      <path d="M22,58 L12,70 L28,62 Z" fill="url(#gold-metal)" />
      <!-- Voice bars in bubble -->
      <line x1="22" y1="35" x2="22" y2="35" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
      <line x1="30" y1="27" x2="30" y2="43" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
      <line x1="38" y1="22" x2="38" y2="48" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
      <line x1="46" y1="30" x2="46" y2="40" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Radiant Light Beam from Book -->
  <ellipse cx="600" cy="420" rx="350" ry="120" fill="url(#book-light)" />

  <!-- OPEN ILLUMINATED MAGICAL BOOK -->
  <g transform="translate(600, 420)">
    <!-- Book Base & Binding -->
    <path d="M-260,20 Q0,50 260,20 L280,35 Q0,75 -280,35 Z" fill="#b45309" stroke="#f59e0b" stroke-width="2" />
    <!-- Golden Pages Thickness -->
    <path d="M-260,18 Q0,45 260,18 L270,8 Q0,35 -270,8 Z" fill="url(#gold-metal)" opacity="0.8" />
    <!-- Left Open Page -->
    <path d="M0,35 Q-140,5 -260,12 L-260,2 Q-140,-5 0,22 Z" fill="#ffffff" stroke="#fef08a" stroke-width="1.5" />
    <!-- Right Open Page -->
    <path d="M0,35 Q140,5 260,12 L260,2 Q140,-5 0,22 Z" fill="#ffffff" stroke="#fef08a" stroke-width="1.5" />
    <!-- Page text lines (Golden subtle) -->
    <path d="M-230,12 Q-140,4 -30,22" stroke="#fcd34d" stroke-width="1.5" fill="none" opacity="0.7" />
    <path d="M-230,17 Q-140,9 -30,27" stroke="#fcd34d" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M30,22 Q140,4 230,12" stroke="#fcd34d" stroke-width="1.5" fill="none" opacity="0.7" />
    <path d="M30,27 Q140,9 230,17" stroke="#fcd34d" stroke-width="1.5" fill="none" opacity="0.6" />
    <!-- Magic sparkles rising from book -->
    <circle cx="-120" cy="-15" r="3" fill="#fef08a" />
    <circle cx="-60" cy="-35" r="4" fill="#38bdf8" />
    <circle cx="80" cy="-25" r="3.5" fill="#fef08a" />
    <circle cx="140" cy="-45" r="2.5" fill="#38bdf8" />
  </g>

  <!-- CENTRAL SCHOLARLY BLUE OWL CHARACTER -->
  <g transform="translate(600, 290)">
    <!-- Feet on the book -->
    <ellipse cx="-28" cy="115" rx="14" ry="7" fill="url(#owl-beak)" />
    <ellipse cx="28" cy="115" rx="14" ry="7" fill="url(#owl-beak)" />

    <!-- Blue Wings -->
    <!-- Left Wing -->
    <path d="M-55,50 C-105,65 -115,100 -95,125 C-75,135 -60,110 -50,90 Z" fill="url(#owl-body)" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Right Wing Raised Wave -->
    <path d="M55,45 C100,30 145,55 125,95 C105,120 75,110 50,85 Z" fill="url(#owl-body)" stroke="#38bdf8" stroke-width="2.5" />
    <!-- Wing Feathers Details -->
    <path d="M100,50 Q130,65 110,85" stroke="#fef08a" stroke-width="2" fill="none" />
    <path d="M-80,75 Q-105,95 -85,110" stroke="#fef08a" stroke-width="2" fill="none" />

    <!-- Owl Body -->
    <ellipse cx="0" cy="55" rx="65" ry="70" fill="url(#owl-body)" stroke="#7dd3fc" stroke-width="3" />
    <!-- Owl Belly -->
    <ellipse cx="0" cy="70" rx="42" ry="48" fill="url(#owl-belly)" />
    <path d="M-15,65 Q0,75 15,65 M-20,80 Q0,92 20,80 M-12,95 Q0,103 12,95" stroke="#38bdf8" stroke-width="2.5" fill="none" />

    <!-- Big Eyes with Eyeglasses -->
    <!-- Eye Background Rings -->
    <circle cx="-25" cy="20" r="24" fill="#ffffff" stroke="#1e293b" stroke-width="4" />
    <circle cx="25" cy="20" r="24" fill="#ffffff" stroke="#1e293b" stroke-width="4" />
    <!-- Pupils (Cheerful gaze) -->
    <circle cx="-22" cy="18" r="14" fill="#0284c7" />
    <circle cx="28" cy="18" r="14" fill="#0284c7" />
    <circle cx="-20" cy="18" r="8" fill="#0f172a" />
    <circle cx="30" cy="18" r="8" fill="#0f172a" />
    <!-- Eye Highlights -->
    <circle cx="-24" cy="14" r="5" fill="#ffffff" />
    <circle cx="26" cy="14" r="5" fill="#ffffff" />
    <circle cx="-16" cy="22" r="2" fill="#ffffff" />
    <circle cx="34" cy="22" r="2" fill="#ffffff" />

    <!-- Black & Gold Eyeglasses Frame -->
    <circle cx="-25" cy="20" r="26" fill="none" stroke="#1e293b" stroke-width="5" />
    <circle cx="25" cy="20" r="26" fill="none" stroke="#1e293b" stroke-width="5" />
    <path d="M-2,20 L2,20" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
    <path d="M-51,20 L-58,15" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <path d="M51,20 L58,15" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

    <!-- Orange Beak (Happy open smile) -->
    <path d="M-14,35 Q0,32 14,35 Q0,62 -14,35 Z" fill="url(#owl-beak)" stroke="#c2410c" stroke-width="2" />
    <path d="M-8,42 Q0,52 8,42" fill="#7f1d1d" />

    <!-- Graduation Cap (Mortarboard) -->
    <g transform="translate(0, -35)">
      <!-- Cap Base -->
      <ellipse cx="0" cy="18" rx="34" ry="14" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
      <!-- Top Diamond Board -->
      <polygon points="0,-16 68,0 0,16 -68,0" fill="#0f172a" stroke="#334155" stroke-width="3" />
      <polygon points="0,-14 62,0 0,14 -62,0" fill="#1e293b" />
      <!-- Golden Center Button -->
      <circle cx="0" cy="0" r="5" fill="url(#gold-metal)" />
      <!-- Golden Tassel hanging to the left -->
      <path d="M0,0 Q-35,-5 -45,18 L-42,42 L-48,42 Z" fill="url(#gold-metal)" stroke="#d97706" stroke-width="1.5" />
    </g>
  </g>

</svg>
