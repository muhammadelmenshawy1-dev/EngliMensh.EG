<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Cosmic Gradient -->
    <radialGradient id="pwa-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="pwa-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Metallic Silver/Blue Gradient -->
    <linearGradient id="pwa-silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Owl Body Gradient -->
    <linearGradient id="pwa-owl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <filter id="pwa-glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background with Safe Padding for Maskable Icons -->
  <rect width="512" height="512" rx="110" fill="url(#pwa-bg)" />
  <circle cx="256" cy="256" r="235" fill="none" stroke="url(#pwa-gold)" stroke-width="6" opacity="0.85" />

  <!-- Ambient Golden Glow around Book and Owl -->
  <circle cx="256" cy="240" r="160" fill="#0284c7" opacity="0.18" filter="url(#pwa-glow)" />

  <!-- Stars -->
  <circle cx="110" cy="120" r="2.5" fill="#ffffff" opacity="0.8" />
  <circle cx="410" cy="110" r="3" fill="#ffffff" opacity="0.9" />
  <circle cx="90" cy="380" r="2" fill="#ffffff" opacity="0.7" />
  <circle cx="420" cy="390" r="2.5" fill="#ffffff" opacity="0.8" />

  <!-- Open Book at base -->
  <g transform="translate(256, 335)">
    <path d="M-140,15 Q0,35 140,15 L145,28 Q0,50 -145,28 Z" fill="#b45309" stroke="#f59e0b" stroke-width="2" />
    <path d="M0,28 Q-75,8 -140,12 L-140,4 Q-75,0 0,18 Z" fill="#ffffff" stroke="#fef08a" stroke-width="1.5" />
    <path d="M0,28 Q75,8 140,12 L140,4 Q75,0 0,18 Z" fill="#ffffff" stroke="#fef08a" stroke-width="1.5" />
  </g>

  <!-- Owl Scholar Character -->
  <g transform="translate(256, 220)">
    <!-- Wings -->
    <path d="M-40,40 C-80,50 -90,80 -75,100 C-60,110 -50,90 -40,75 Z" fill="url(#pwa-owl)" stroke="#38bdf8" stroke-width="2" />
    <path d="M40,35 C80,20 110,40 95,75 C80,95 60,85 40,65 Z" fill="url(#pwa-owl)" stroke="#38bdf8" stroke-width="2" />

    <!-- Body -->
    <ellipse cx="0" cy="45" rx="55" ry="60" fill="url(#pwa-owl)" stroke="#7dd3fc" stroke-width="2.5" />
    <!-- Belly -->
    <ellipse cx="0" cy="58" rx="36" ry="40" fill="#ffffff" />
    <path d="M-12,54 Q0,62 12,54 M-16,68 Q0,78 16,68" stroke="#38bdf8" stroke-width="2" fill="none" />

    <!-- Big Eyes & Eyeglasses -->
    <circle cx="-20" cy="18" r="20" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
    <circle cx="20" cy="18" r="20" fill="#ffffff" stroke="#1e293b" stroke-width="3" />
    <circle cx="-18" cy="16" r="11" fill="#0284c7" />
    <circle cx="22" cy="16" r="11" fill="#0284c7" />
    <circle cx="-16" cy="16" r="6" fill="#0f172a" />
    <circle cx="24" cy="16" r="6" fill="#0f172a" />
    <circle cx="-19" cy="13" r="4" fill="#ffffff" />
    <circle cx="21" cy="13" r="4" fill="#ffffff" />

    <!-- Glasses Frame -->
    <circle cx="-20" cy="18" r="22" fill="none" stroke="#1e293b" stroke-width="4" />
    <circle cx="20" cy="18" r="22" fill="none" stroke="#1e293b" stroke-width="4" />
    <line x1="-2" y1="18" x2="2" y2="18" stroke="#1e293b" stroke-width="4" />

    <!-- Beak -->
    <path d="M-10,30 Q0,27 10,30 Q0,50 -10,30 Z" fill="#ea580c" stroke="#c2410c" stroke-width="1.5" />

    <!-- Graduation Cap -->
    <g transform="translate(0, -32)">
      <polygon points="0,-14 55,0 0,14 -55,0" fill="#0f172a" stroke="#475569" stroke-width="2.5" />
      <polygon points="0,-12 50,0 0,12 -50,0" fill="#1e293b" />
      <circle cx="0" cy="0" r="4" fill="url(#pwa-gold)" />
      <path d="M0,0 Q-28,-4 -36,15 L-33,35 L-39,35 Z" fill="url(#pwa-gold)" stroke="#d97706" stroke-width="1.2" />
    </g>
  </g>

  <!-- Typography ENGLIMENSH -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44"
        fill="url(#pwa-silver)" text-anchor="middle" letter-spacing="2" filter="url(#pwa-glow)">EngliMensh</text>
  <text x="256" y="452" font-family="'Cairo', system-ui, sans-serif" font-weight="800" font-size="14"
        fill="url(#pwa-gold)" text-anchor="middle" letter-spacing="4">MASTER ENGLISH</text>
</svg>
